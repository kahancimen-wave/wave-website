<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="referrer" content="no-referrer">
  <!-- Bestaetigung des Loeschwunschs einer gesperrten Person (a141, Kahan 25.11.2026).
       Token nur im Fragment (#), das nie an einen Server geht. Das Oeffnen der
       Seite loescht NICHTS (Schutz vor Vorabruf durch Mailprogramme und
       Virenscanner); erst der Knopf schickt den Token per POST. Keine
       personenbezogenen Daten auf der Seite, keine fremden Skripte/Schriften.
       Texte: Deutsch CC nach Kahans Mail, 8 Sprachen maschinell (a160). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-9D1uu4v7aram/YxnpVwpNTjx48nXas1mPjv2uxlb24Y='; style-src 'unsafe-inline'; connect-src https://uqydyklazfbfbsnktezx.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Wave</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; color: #334155; background: #fff; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px 16px; }
    main { max-width: 460px; width: 100%; text-align: center; }
    h1 { font-size: 22px; font-weight: 600; color: #0f172a; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
    button { font: inherit; font-size: 16px; font-weight: 600; padding: 12px 24px; border: none; border-radius: 12px; background: #b91c1c; color: #fff; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: default; }
    [hidden] { display: none !important; }
    #status { margin-top: 20px; min-height: 24px; }
  </style>
</head>
<body>
  <main>
    <h1 id="titel"></h1>
    <p id="hinweis" hidden></p>
    <button id="knopf" type="button" hidden></button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
(function () {
  var EF = 'https://uqydyklazfbfbsnktezx.supabase.co/functions/v1/loeschung-bestaetigen';
  var TEXTE = {
    de: { titel: 'Konto löschen', pruefen: 'Der Link wird geprüft …', laeuft: 'Einen Moment …', knopf: 'Konto löschen',
      hinweis: 'Wenn du die Löschung deines Wave-Kontos möchtest, bestätige sie mit dem Knopf. Mit der Löschung entfällt die Möglichkeit, dein Konto nach einem Widerspruch zurückzubekommen. Die Unterlagen zur Sperrung bewahren wir drei Jahre auf. Wenn du keine Löschung verlangt hast, schließe diese Seite einfach.',
      fertig: 'Dein Konto wird gelöscht.', neutral: 'Dieser Link ist nicht gültig. Bei Fragen schreib uns an support@waveindex.de.',
      fehler: 'Das hat gerade nicht geklappt. Bitte versuche es später erneut.' },
    en: { titel: 'Delete account', pruefen: 'Checking the link …', laeuft: 'One moment …', knopf: 'Delete account',
      hinweis: 'If you want your Wave account to be deleted, confirm it with the button. With the deletion, you lose the possibility of getting your account back after an objection. We keep the records of the suspension for three years. If you did not request a deletion, simply close this page.',
      fertig: 'Your account is being deleted.', neutral: 'This link is not valid. If you have questions, write to us at support@waveindex.de.',
      fehler: 'That did not work just now. Please try again later.' },
    tr: { titel: 'Hesabı sil', pruefen: 'Bağlantı kontrol ediliyor …', laeuft: 'Bir saniye …', knopf: 'Hesabı sil',
      hinweis: 'Wave hesabının silinmesini istiyorsan düğmeyle onayla. Silme işlemiyle, bir itirazdan sonra hesabını geri alma imkânı ortadan kalkar. Engellemeye ilişkin belgeleri üç yıl saklıyoruz. Silme talebinde bulunmadıysan bu sayfayı kapatman yeterli.',
      fertig: 'Hesabın siliniyor.', neutral: 'Bu bağlantı geçerli değil. Sorun varsa support@waveindex.de adresine yaz.',
      fehler: 'Şu anda olmadı. Lütfen daha sonra tekrar dene.' },
    es: { titel: 'Eliminar cuenta', pruefen: 'Comprobando el enlace …', laeuft: 'Un momento …', knopf: 'Eliminar cuenta',
      hinweis: 'Si quieres que se elimine tu cuenta de Wave, confírmalo con el botón. Con la eliminación pierdes la posibilidad de recuperar tu cuenta tras una reclamación. Conservamos la documentación del bloqueo durante tres años. Si no has solicitado ninguna eliminación, simplemente cierra esta página.',
      fertig: 'Tu cuenta se está eliminando.', neutral: 'Este enlace no es válido. Si tienes preguntas, escríbenos a support@waveindex.de.',
      fehler: 'No ha funcionado. Inténtalo de nuevo más tarde.' },
    fr: { titel: 'Supprimer le compte', pruefen: 'Vérification du lien …', laeuft: 'Un instant …', knopf: 'Supprimer le compte',
      hinweis: 'Si tu souhaites la suppression de ton compte Wave, confirme-la avec le bouton. Avec la suppression, tu perds la possibilité de récupérer ton compte après une contestation. Nous conservons les documents relatifs à la suspension pendant trois ans. Si tu n\'as pas demandé de suppression, ferme simplement cette page.',
      fertig: 'Ton compte est en cours de suppression.', neutral: 'Ce lien n\'est pas valable. Pour toute question, écris-nous à support@waveindex.de.',
      fehler: 'Cela n\'a pas fonctionné. Réessaie plus tard.' },
    pl: { titel: 'Usuń konto', pruefen: 'Sprawdzanie linku …', laeuft: 'Chwileczkę …', knopf: 'Usuń konto',
      hinweis: 'Jeśli chcesz usunąć swoje konto Wave, potwierdź to przyciskiem. Po usunięciu nie będzie już można odzyskać konta po odwołaniu. Dokumentację blokady przechowujemy przez trzy lata. Jeśli nie prosiłeś(-aś) o usunięcie, po prostu zamknij tę stronę.',
      fertig: 'Twoje konto jest usuwane.', neutral: 'Ten link jest nieważny. W razie pytań napisz do nas na support@waveindex.de.',
      fehler: 'Nie udało się. Spróbuj ponownie później.' },
    ar: { titel: 'حذف الحساب', pruefen: 'جارٍ التحقق من الرابط …', laeuft: 'لحظة من فضلك …', knopf: 'حذف الحساب',
      hinweis: 'إذا كنت تريد حذف حسابك في Wave، فأكّد ذلك بالضغط على الزر. بالحذف تفقد إمكانية استعادة حسابك بعد الاعتراض. نحتفظ بالمستندات المتعلقة بالحظر لمدة ثلاث سنوات. إذا لم تطلب الحذف، فأغلق هذه الصفحة فقط.',
      fertig: 'يجري حذف حسابك.', neutral: 'هذا الرابط غير صالح. إذا كانت لديك أسئلة، فراسلنا على support@waveindex.de.',
      fehler: 'لم ينجح ذلك الآن. يُرجى المحاولة لاحقًا.' },
    ru: { titel: 'Удалить аккаунт', pruefen: 'Проверяем ссылку …', laeuft: 'Минутку …', knopf: 'Удалить аккаунт',
      hinweis: 'Если ты хочешь удалить свой аккаунт Wave, подтверди это кнопкой. После удаления вернуть аккаунт после возражения будет невозможно. Документы о блокировке мы храним три года. Если ты не запрашивал(а) удаление, просто закрой эту страницу.',
      fertig: 'Твой аккаунт удаляется.', neutral: 'Эта ссылка недействительна. Если есть вопросы, напиши нам на support@waveindex.de.',
      fehler: 'Сейчас не получилось. Пожалуйста, попробуй позже.' },
    it: { titel: 'Elimina account', pruefen: 'Verifica del link …', laeuft: 'Un momento …', knopf: 'Elimina account',
      hinweis: 'Se desideri l\'eliminazione del tuo account Wave, confermala con il pulsante. Con l\'eliminazione perdi la possibilità di riavere il tuo account dopo un ricorso. Conserviamo la documentazione relativa al blocco per tre anni. Se non hai chiesto l\'eliminazione, chiudi semplicemente questa pagina.',
      fertig: 'Il tuo account viene eliminato.', neutral: 'Questo link non è valido. Per domande scrivici a support@waveindex.de.',
      fehler: 'Non ha funzionato. Riprova più tardi.' }
  };
  var p = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var token = p.get('t') || '';
  var l = p.get('l') || '';
  if (!TEXTE[l]) l = (navigator.language || 'de').slice(0, 2).toLowerCase();
  if (!TEXTE[l]) l = 'de';
  var T = TEXTE[l];
  // Fragment sofort aus der Adresszeile entfernen (Verlauf, Bildschirmfotos).
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.title = T.titel + ' | Wave';
  var titel = document.getElementById('titel'), hinweis = document.getElementById('hinweis');
  var knopf = document.getElementById('knopf'), status = document.getElementById('status');
  titel.textContent = T.titel;
  hinweis.textContent = T.hinweis;
  knopf.textContent = T.knopf;
  function neutral() { hinweis.hidden = true; knopf.hidden = true; status.textContent = T.neutral; }
  async function rufen(aktion) {
    var r = await fetch(EF, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aktion: aktion, t: token }), cache: 'no-store', referrerPolicy: 'no-referrer', credentials: 'omit' });
    var j = {}; try { j = await r.json(); } catch (e) {}
    return { ok: r.ok && j.ok === true, grund: j.grund || 'serverfehler' };
  }
  if (!/^[A-Za-z0-9_-]{43}$/.test(token)) { neutral(); return; }
  // Oeffnen: nur pruefen, nichts loeschen.
  status.textContent = T.pruefen;
  rufen('pruefen').then(function (r) {
    if (r.ok) { status.textContent = ''; hinweis.hidden = false; knopf.hidden = false; }
    else if (r.grund === 'ungueltig') { neutral(); }
    else { status.textContent = T.fehler; }
  }, function () { status.textContent = T.fehler; });
  knopf.addEventListener('click', async function () {
    knopf.disabled = true;
    status.textContent = T.laeuft;
    try {
      var r = await rufen('bestaetigen');
      if (r.ok) { hinweis.hidden = true; knopf.hidden = true; status.textContent = T.fertig; return; }
      if (r.grund === 'ungueltig') { neutral(); return; }
      status.textContent = T.fehler; knopf.disabled = false;
    } catch (e) { status.textContent = T.fehler; knopf.disabled = false; }
  });
})();
</script>
</body>
</html>
