  <script>
(function () {

  var status = document.getElementById('status');
  knopf.textContent = T.start;
  var p = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var token = p.get('t') || '', schluessel = p.get('k') || '';
  // Fragment sofort aus der Adresszeile entfernen (Verlauf, Bildschirmfotos).
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  var ok = /^[A-Za-z0-9_-]{43}$/;

  function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  async function teilHolen(n) {

    if (!r.ok || !j.ok) { throw new Error(j.grund || 'fehler'); }
    var d = await fetch(j.url, { cache: 'no-store', referrerPolicy: 'no-referrer' });
    if (!d.ok) throw new Error('fehler');
    return { info: j, daten: new Uint8Array(await d.arrayBuffer()) };
  }
  knopf.addEventListener('click', async function () {
    knopf.disabled = true;
    try {
      var key = await crypto.subtle.importKey('raw', b64u(schluessel), { name: 'AES-GCM' }, false, ['decrypt']);
      var teile = 1, az = 'Wave';
      for (var n = 1; n <= teile; n++) {

      var g = e && e.message;
